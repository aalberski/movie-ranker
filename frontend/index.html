<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Movie Ranker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #1A1714;
    --bg-raised: #24201C;
    --gold: #D4A24C;
    --cream: #EDE7DD;
    --burgundy: #6B2737;
    --muted: #948B7E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 2.2rem;
    margin: 0 0 6px;
    letter-spacing: 0.01em;
  }

  .tagline {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0;
  }

  #matchup {
    display: flex;
    align-items: center;
    gap: 28px;
    max-width: 780px;
    width: 100%;
  }

  .movie-card {
    flex: 1;
    background: var(--bg-raised);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.15s ease, transform 0.15s ease;
    display: flex;
    flex-direction: column;
  }

  .movie-card:hover {
    border-color: var(--gold);
    transform: translateY(-3px);
  }

  .movie-card:active {
    transform: translateY(0);
  }

  .movie-card img {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    display: block;
    background: #000;
  }

  .movie-card .title {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 1.05rem;
    padding: 14px 16px;
    text-align: center;
    line-height: 1.3;
  }

  .vs {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--burgundy);
    -webkit-text-stroke: 1px var(--gold);
    flex-shrink: 0;
  }

  #status {
    margin-top: 24px;
    color: var(--muted);
    font-size: 0.9rem;
    min-height: 1.2em;
  }

  nav {
    margin-top: 40px;
  }

  nav button {
    background: none;
    border: 1px solid var(--muted);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    padding: 8px 18px;
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  nav button:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  #leaderboard {
    display: none;
    width: 100%;
    max-width: 560px;
    margin-top: 24px;
  }

  #leaderboard.visible {
    display: block;
  }

  #matchup.hidden {
    display: none;
  }

  .rank-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 0;
    border-bottom: 1px solid var(--bg-raised);
  }

  .rank-num {
    font-family: 'Playfair Display', serif;
    color: var(--gold);
    width: 28px;
    text-align: right;
    font-size: 1.1rem;
  }

  .rank-title {
    flex: 1;
    font-size: 0.95rem;
  }

  .rank-elo {
    color: var(--muted);
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 600px) {
    #matchup { gap: 14px; }
    .movie-card .title { font-size: 0.9rem; padding: 10px 12px; }
    .vs { font-size: 1.1rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Movie Ranker</h1>
  <p class="tagline">Pick a winner. The rankings sort themselves out.</p>
</header>

<div id="matchup">
  <div class="movie-card" id="card-a">
    <img id="poster-a" src="" alt="">
    <div class="title" id="title-a">Loading…</div>
  </div>
  <div class="vs">VS</div>
  <div class="movie-card" id="card-b">
    <img id="poster-b" src="" alt="">
    <div class="title" id="title-b">Loading…</div>
  </div>
</div>

<p id="status"></p>

<div id="leaderboard">
  <div id="leaderboard-list"></div>
</div>

<nav>
  <button id="toggle-view">View Leaderboard</button>
</nav>

<script>
  const API_BASE = "http://localhost:8000";
  const POSTER_BASE = "https://image.tmdb.org/t/p/w342";

  let current = { a: null, b: null };
  let showingLeaderboard = false;

  async function loadPair() {
    setStatus("Fetching a fresh matchup…");
    try {
      const res = await fetch(`${API_BASE}/pair`);
      if (!res.ok) throw new Error(`Server responded ${res.status}`);
      const [a, b] = await res.json();
      current = { a, b };
      renderMovie("a", a);
      renderMovie("b", b);
      setStatus("");
    } catch (err) {
      setStatus("Couldn't load a matchup — is the API running?");
      console.error(err);
    }
  }

  function renderMovie(side, movie) {
    document.getElementById(`title-${side}`).textContent = movie.title;
    const posterEl = document.getElementById(`poster-${side}`);
    posterEl.src = movie.poster_path
      ? `${POSTER_BASE}${movie.poster_path}`
      : "";
    posterEl.alt = movie.title;
  }

  async function vote(winnerSide) {
    const winner = current[winnerSide];
    const loser = current[winnerSide === "a" ? "b" : "a"];
    if (!winner || !loser) return;

    setStatus("Recording your pick…");
    try {
      const res = await fetch(
        `${API_BASE}/vote?winner=${winner.id}&loser=${loser.id}`,
        { method: "POST" }
      );
      if (!res.ok) throw new Error(`Server responded ${res.status}`);
      await loadPair();
    } catch (err) {
      setStatus("Vote didn't go through — try again.");
      console.error(err);
    }
  }

  function setStatus(text) {
    document.getElementById("status").textContent = text;
  }

  async function loadLeaderboard() {
    const listEl = document.getElementById("leaderboard-list");
    listEl.innerHTML = "";
    try {
      const res = await fetch(`${API_BASE}/leaderboard`);
      if (!res.ok) throw new Error(`Server responded ${res.status}`);
      const rows = await res.json();
      rows.forEach((row, i) => {
        const title = Array.isArray(row) ? row[0] : row.title;
        const elo = Array.isArray(row) ? row[1] : row.elo_rating;
        const div = document.createElement("div");
        div.className = "rank-row";
        div.innerHTML = `
          <span class="rank-num">${i + 1}</span>
          <span class="rank-title">${title}</span>
          ${elo !== undefined ? `<span class="rank-elo">${Math.round(elo)}</span>` : ""}
        `;
        listEl.appendChild(div);
      });
    } catch (err) {
      listEl.textContent = "Couldn't load the leaderboard.";
      console.error(err);
    }
  }

  document.getElementById("card-a").addEventListener("click", () => vote("a"));
  document.getElementById("card-b").addEventListener("click", () => vote("b"));

  document.getElementById("toggle-view").addEventListener("click", async () => {
    showingLeaderboard = !showingLeaderboard;
    const matchupEl = document.getElementById("matchup");
    const leaderboardEl = document.getElementById("leaderboard");
    const btn = document.getElementById("toggle-view");
    const statusEl = document.getElementById("status");

    if (showingLeaderboard) {
      matchupEl.classList.add("hidden");
      leaderboardEl.classList.add("visible");
      statusEl.style.display = "none";
      btn.textContent = "Back to Matchup";
      await loadLeaderboard();
    } else {
      matchupEl.classList.remove("hidden");
      leaderboardEl.classList.remove("visible");
      statusEl.style.display = "block";
      btn.textContent = "View Leaderboard";
    }
  });

  loadPair();
</script>

</body>
</html>
